name: Concurrency groups
run-name: Experimenting concurrency

on: 
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
  
jobs:
  matrix_tests:
    strategy:
      matrix:
        version: ["0.1.0", "0.1.1", "0.2.0"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    concurrency: 
      group: ${{ github.job }}-${{ matrix.os }}
    steps:
      - name: Run a multi-line script
        run: |
          echo "Running on: ${{ matrix.os }} version: ${{ matrix.version }}"
  
